# Unit tests only.
#
# `test:smoke` loads the *installed* @deepseek-ai/cordis, dsh-web and
# dsh-user-questions out of a DSH profile, and the two acceptance suites run a
# real `dsh` binary and open a real browser. None of that exists on a runner, so
# CI covers the pure and injectable layers and the rest stays local — see
# README §8 for what each suite needs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is in the matrix on purpose: the opener is platform-dispatched and
    # the first CI run was green on Windows, red on Linux, because one test built
    # its fake staging root as `C:/fake-tmp`. Both platforms now have to pass.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 and 24 only: `npm test` passes a glob to `node --test`, and Node 20
        # treats it as a literal path ("Could not find '.../test/*.test.mjs'") -
        # glob expansion in the test runner arrived in Node 21. Node 20 is also
        # out of maintenance (EOL 2026-04-30), so supporting it buys nothing.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
